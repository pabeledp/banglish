name = "banglish"
main = "worker/index.js"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "banglish.bd/*", zone_name = "banglish.bd" }
]

# Direct Next.js static exported output directory
[assets]
directory = "out"

[vars]
WEBHOOK_VERIFY_TOKEN = "banglish_keyboard_2026"
PHONE_NUMBER_ID = "1285739121299923"
META_GRAPH_API_VERSION = "v20.0"
GEMINI_MODEL = "gemini-flash-latest"

[[d1_databases]]
binding = "DB"
database_name = "banglish-bot-db"
database_id = "8e9591ac-931d-4fd7-866a-b9b0f2531e01"

[observability]
enabled = true

[env.dev]
name = "banglish-dev"
routes = [
  { pattern = "dev.banglish.bd/*", zone_name = "banglish.bd" }
]
