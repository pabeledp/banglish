name = "banglish"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "banglish.bd/*", zone_name = "banglish.bd" }
]

# Direct Next.js static exported output directory
[assets]
directory = "out"

[env.dev]
name = "banglish-dev"
routes = [
  { pattern = "dev.banglish.bd/*", zone_name = "banglish.bd" }
]
